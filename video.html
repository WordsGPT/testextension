<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch a Video — Verba</title>
    <link rel="stylesheet" href="dist/video.css" />
  </head>
  <body>
    <div id="video-app"></div>

    <script type="module" src="dist/video.js"></script>
  </body>
</html>
